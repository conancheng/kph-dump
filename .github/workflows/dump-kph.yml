name: dump-kph

# 开盘红 (com.yzj.kaipanh) 脱壳 —— GitHub Actions KVM 版 v3
#
# v3 关键修复:
#   reactivecircus/android-emulator-runner 会把 script 字段【按行拆开】,
#   每行单独交给 /usr/bin/sh -c 执行 —— 多行 if/while/变量赋值必然语法错误。
#   所以脱壳逻辑全部挪进 tools/dump.sh, 这里只留一行调用。
#
# 产物 artifact "dexdump":
#   diag/    环境诊断 + script.log
#   dump/    frida-dexdump
#   dump2/   自定义 dexdump_360.js
#   dump3/   /proc/pid/mem 硬 dump + maps.txt + logcat.txt
on:
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level'
        required: false
        default: '30'
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  API_LEVEL: ${{ inputs.api_level || '30' }}

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "NO /dev/kvm"
          grep -m1 -E 'vmx|svm' /proc/cpuinfo || echo "no vmx/svm"
          free -m

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare frida tooling
        continue-on-error: true
        run: |
          set -x
          pip install --quiet frida==16.1.4 frida-tools frida-dexdump || echo "PIP_FAIL"
          python -c "import frida; print('frida', frida.__version__)" || echo "FRIDA_IMPORT_FAIL"
          curl -sL --retry 3 --max-time 180 -o /tmp/fs.xz \
            https://github.com/frida/frida/releases/download/16.1.4/frida-server-16.1.4-android-x86_64.xz \
            || echo "CURL_FAIL"
          ls -l /tmp/fs.xz || true
          if [ -f /tmp/fs.xz ]; then
            unxz -f /tmp/fs.xz && chmod +x /tmp/fs && ls -l /tmp/fs
          fi
          echo "PREP_DONE"

      - name: Locate APK
        run: |
          set -eux
          APK=$(find . -maxdepth 2 -name 'kph_*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::repo 根目录没有 kph_*.apk"; exit 1; }
          echo "APK=$(realpath "$APK")" >> "$GITHUB_ENV"
          ls -l "$APK"

      - name: Boot emulator and dump
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -accel auto
          # 只能是一行: action 会逐行拆开 script
          script: bash tools/dump.sh

      - name: Verify and fix dex
        if: always()
        continue-on-error: true
        run: |
          set +e
          for d in dump dump2 dump3; do
            [ -d "$d" ] && python tools/run_dexdump.py verify "$d" --fix 2>&1 | tail -30
          done
          echo "--- all dex ---"
          find . -name '*.dex' -o -name '*.fixed.dex' 2>/dev/null | head -50

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dexdump
          path: |
            diag/**
            dump/**
            dump2/**
            dump3/**
          retention-days: 7
          if-no-files-found: warn
